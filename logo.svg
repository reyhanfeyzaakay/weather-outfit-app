<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="blue" stroke-width="5" />
  
  <!-- Sun - a symbol for good weather -->
  <circle cx="60" cy="60" r="20" fill="yellow" />
  <line x1="60" y1="40" x2="60" y2="0" stroke="yellow" stroke-width="3" />
  <line x1="60" y1="80" x2="60" y2="100" stroke="yellow" stroke-width="3" />
  <line x1="40" y1="60" x2="0" y2="60" stroke="yellow" stroke-width="3" />
  <line x1="80" y1="60" x2="100" y2="60" stroke="yellow" stroke-width="3" />

  <!-- Cloud -->
  <ellipse cx="140" cy="60" rx="30" ry="15" fill="lightgrey" />
  <ellipse cx="160" cy="70" rx="35" ry="20" fill="lightgrey" />
  <ellipse cx="150" cy="60" rx="20" ry="10" fill="lightgrey" />

  <!-- Outfit element, depicted as a shirt -->
  <rect x="70" y="110" width="60" height="40" fill="blue" />
  <rect x="70" y="130" width="10" height="10" fill="blue" />
  <rect x="120" y="130" width="10" height="10" fill="blue" />

  <!-- Text for the logo -->
  <text x="50" y="190" font-family="Arial" font-size="20" fill="blue">WeatherFit</text>
</svg>
